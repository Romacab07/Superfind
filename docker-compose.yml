# SoundWave — full local stack (backend + frontend) in one command: docker compose up --build
#
# Optional environment (reads .env automatically, see .env.example):
#   LOCAL_MUSIC_PATH  Host folder with your own audio files. Mounted read-only at /app/local-music.
#                     Defaults to ./music, which stays empty unless you add files to it.
#   GEMINI_API_KEY    Enables real Gemini recommendations (falls back to heuristics when empty).
#   JAMENDO_CLIENT_ID Enables the Jamendo catalog provider (seed catalog is used when empty).

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soundwave-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=local
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID:-}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      # Path inside the container — matches the read-only mount below.
      - LOCAL_MUSIC_PATH=/app/local-music
    volumes:
      - "${LOCAL_MUSIC_PATH:-./music}:/app/local-music:ro"
    networks:
      - soundwave-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soundwave-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - soundwave-net

networks:
  soundwave-net:
    driver: bridge
