server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: soundwave-music-discovery
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    exclude:
      - com.google.cloud.spring.autoconfigure.firestore.GcpFirestoreAutoConfiguration
      - com.google.cloud.spring.autoconfigure.secretmanager.GcpSecretManagerAutoConfiguration
      - com.google.cloud.spring.autoconfigure.core.GcpContextAutoConfiguration
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Management & Health Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Custom GCP Configuration
gcp:
  project-id: ${GCP_PROJECT_ID:soundwave-music-discovery}
  firestore:
    enabled: ${FIRESTORE_ENABLED:false}
    collections:
      tracks: tracks
      play-events: play_events
      sync-metadata: sync_metadata
  secret-manager:
    enabled: ${SECRET_MANAGER_ENABLED:false}

# Gemini AI API Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  api-base-url: https://generativelanguage.googleapis.com/v1beta/models
  temperature: 0.7
  timeout-seconds: 15

# Music Catalog Providers Configuration
music:
  providers:
    jamendo:
      client-id: ${JAMENDO_CLIENT_ID:}
    generic-open:
      enabled: false

# CORS Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging configuration
logging:
  level:
    root: INFO
    com.soundwave.musicdiscovery: DEBUG
    org.springframework.web: INFO
