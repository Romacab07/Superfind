version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soundwave-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=local
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JAMENDO_CLIENT_ID=${JAMENDO_CLIENT_ID:-}
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - LOCAL_MUSIC_PATH=/app/local-music
    volumes:
      - "E:/Pendrive 2022/Musica/Cachengue y trapo/Trvup tranca:/app/local-music:ro"
    networks:
      - soundwave-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soundwave-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - soundwave-net

networks:
  soundwave-net:
    driver: bridge
